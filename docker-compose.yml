services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: marky
      POSTGRES_USER: marky
      POSTGRES_PASSWORD: marky
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marky -d marky"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # No `command:` override: uses the image CMD (scripts/start.sh), same as Railway:
    # release (migrate + createcachetable + seed) then gunicorn. collectstatic runs at build.
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:
