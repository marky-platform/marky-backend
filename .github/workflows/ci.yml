name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite needs PostGIS: business.Branch.location is a geography PointField,
    # which the plain SQLite backend cannot create. Same image family as production.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for CI only; nothing here is a real secret.
      DEBUG: "1"
      SECRET_KEY: ci-only-not-a-secret
      HOST: localhost
      FRONTEND_URL: http://localhost:3000
      DEFAULT_FROM_EMAIL: no-reply@ci.local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marky

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Dockerfile uses python:3.11.18
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install GDAL/GEOS (needed by django.contrib.gis)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Ruff (pyflakes + syntax errors)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test

      - name: Release command is idempotent (twice on PostGIS)
        # Mismo paso que corre scripts/start.sh al arrancar; correrlo dos veces prueba que es seguro en cada deploy.
        run: |
          python manage.py release
          python manage.py release

      - name: Dependency audit (pip-audit)
        # Audits the pinned requirements.txt only (no resolution, no install).
        # Known open advisories are tracked in DEFERRED-PLATFORM-TASKS (Pillow 13,
        # transitive pins); non-blocking until those are resolved.
        continue-on-error: true
        run: pip-audit -r requirements.txt --no-deps --disable-pip
